--- !ditz.rubyforge.org,2008-03-06/issue 
title: netrekd fails to start if previous pid owned by another user
desc: |-
  netrekd: failed on test of pid 1198 existence
  kill: Operation not permitted
  
  var/netrekd.pid contained 1198, and 1198 was an apache process on this
  particular machine.
  
  workaround: remove var/netrekd.pid and retry
type: :bugfix
component: netrek-server-vanilla
release: 
reporter: James Cameron <quozl@us.netrek.org>
status: :closed
disposition: :fixed
creation_time: 2012-03-12 03:50:12.335800 Z
references: []

id: 95804f2c091d322920629741dcb6cc76b21a6afb
log_events: 
- - 2012-03-12 03:50:14.255705 Z
  - James Cameron <quozl@us.netrek.org>
  - created
  - ""
- - 2026-11-24 21:09:12.142643 Z
  - James Cameron <quozl@laptop.org>
  - closed with disposition fixed
  - |-
    netrekd now holds a lock on the pid file while it runs, and ignores a
    pid file that no netrekd has locked, so a pid reused by another
    process no longer stops it starting, and stop and reload no longer
    signal that process.
